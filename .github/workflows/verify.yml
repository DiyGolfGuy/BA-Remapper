name: Verify Remapper
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify app, compile 64-bit builds and test installer upgrade
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Remapper_verification
          path: verification/
      - uses: actions/upload-artifact@v4
        with:
          name: BARemapper_candidate_packages
          path: dist/
