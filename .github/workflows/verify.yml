name: Verify Remapper
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full HD test screen (the screen-watch checks read GSPro-size screens)
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host ("Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds)
      - name: Verify app, compile 64-bit builds and test installer upgrade
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Remapper_verification
          path: verification/
      - uses: actions/upload-artifact@v4
        with:
          name: BARemapper_candidate_packages
          path: dist/
